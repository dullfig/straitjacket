[package]
name = "code-llm"
version = "0.2.0"
edition = "2021"
description = "Constrained decoding for local LLMs — candle inference with structural validators"
authors = ["Daniel Ullfig"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.22"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

# candle-transformers has ~200 model impls — opt-level=3 OOMs on 16GB machines.
# Use opt-level=1 for deps (still 5-10x faster than debug), opt-level=3 for our code.
[profile.release]
opt-level = 3

[profile.release.package."*"]
opt-level = 1
